<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Catalog — AITU-Tech</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-light sticky-top nav-glass">
    <div class="container">
      <a class="navbar-brand brand" href="index.html">AITU-Tech</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMainC">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMainC">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="catalog.html">Catalog</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>

        <div class="nav-icons ms-3 d-flex align-items-center gap-2">

            <a href="favorites.html" class="icon-btn" aria-label="Favorites">
              <i class="bi bi-heart"></i><span class="fav-badge">0</span>
            </a>

            <a href="cart.html" class="icon-btn" aria-label="Cart">
              <i class="bi bi-cart3"></i><span class="cart-badge">0</span>
            </a>

            <a href="login.html" class="icon-btn" data-nav-login aria-label="Login">
              <i class="bi bi-person"></i>
            </a>

            <a href="profile.html" class="icon-btn d-none" data-nav-profile aria-label="Profile">Profile</a>

            <button class="btn btn-sm btn-outline-dark d-none" data-nav-logout type="button">
              Logout
            </button>

          </div>

      </div>
    </div>
  </nav>

  <header class="hero-mini">
    <div class="container">
      <div class="d-flex flex-column flex-lg-row align-items-lg-end justify-content-between gap-3">
        <div>
          <h1 class="h2 fw-bold mb-1">Catalog</h1>
          <p class="text-muted mb-0">Browse products, filter by category and price, and add items to your cart.</p>
        </div>

        <div class="d-flex gap-2">
          <a class="btn btn-outline-dark btn-sm" href="index.html">
            <i class="bi bi-house me-1"></i> Home
          </a>
          <a class="btn btn-dark btn-sm" href="cart.html">
            <i class="bi bi-cart3 me-1"></i> Cart
          </a>
        </div>
      </div>
    </div>
  </header>

  <main class="container py-4">
    <section class="filter-card mb-4">
      <div class="row g-3 align-items-end">
        <div class="col-12 col-md-3">
          <label class="form-label small text-muted mb-1">Category</label>
          <select id="categoryFilter" class="form-select">
            <option value="All">All</option>
          </select>
        </div>

        <div class="col-12 col-md-3">
          <label class="form-label small text-muted mb-1">Search</label>
          <input id="searchInput" class="form-control" placeholder="e.g. iPhone, laptop..." />
        </div>

        <div class="col-6 col-md-2">
          <label class="form-label small text-muted mb-1">Min price</label>
          <input id="priceMin" type="number" class="form-control" min="0" step="1" placeholder="0" />
        </div>

        <div class="col-6 col-md-2">
          <label class="form-label small text-muted mb-1">Max price</label>
          <input id="priceMax" type="number" class="form-control" min="0" step="1" placeholder="999999" />
        </div>

        <div class="col-12 col-md-2">
          <label class="form-label small text-muted mb-1">Sort</label>
          <select id="sortSelect" class="form-select">
            <option value="newest">Newest</option>
            <option value="priceAsc">Price: low → high</option>
            <option value="priceDesc">Price: high → low</option>
            <option value="nameAsc">Name: A → Z</option>
          </select>
        </div>

        <div class="col-12 d-flex gap-2">
          <button id="btnResetFilters" class="btn btn-outline-dark btn-sm">
            <i class="bi bi-arrow-counterclockwise me-1"></i> Reset
          </button>
          <span id="statusText" class="small text-muted align-self-center"></span>
        </div>
      </div>
    </section>

    <section>
      <div id="catalogContainer" class="catalog-grid">
      </div>

      <div id="emptyState" class="empty-state d-none">
        <i class="bi bi-box-seam"></i>
        <div class="fw-semibold mt-2">No products found</div>
        <div class="text-muted small">Try changing filters or search query.</div>
      </div>

      <div id="errorState" class="alert alert-danger d-none mt-3"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

 <script src="js/favorites.js"></script>
  <script src="script.js"></script>

  <script type="module">
    import { initNavbar } from "./js/ui.js";
    initNavbar();
  </script>
  
</body>
</html>
