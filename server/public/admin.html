<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Admin Panel — AITU-Tech</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="hero-mini">
  <div class="container d-flex justify-content-between align-items-center">
    <h2 class="fw-bold mb-0">Admin Panel</h2>
    <div>
      <a href="index.html" class="btn btn-outline-dark btn-sm">Back</a>
      <button id="btnLogout" class="btn btn-dark">Logout</button>
    </div>
  </div>
</header>

<main class="container py-5">
  <!-- ================= CATEGORIES ================= -->

  <div class="card p-4 mb-4">
    <h4 class="mb-3">Categories</h4>

    <!-- CREATE CATEGORY -->
    <div class="row g-2 mb-3">
      <div class="col-md-4">
        <input id="catName" class="form-control" placeholder="Category name">
      </div>
      <div class="col-md-4">
        <input id="catDesc" class="form-control" placeholder="Description">
      </div>
      <div class="col-md-4">
        <button id="btnAddCategory" class="btn btn-success w-100">
          Add Category
        </button>
      </div>
    </div>

    <!-- EDIT CATEGORY -->
    <div class="mt-3">
      <input id="editCatId" type="hidden">

      <div class="row g-2">
        <div class="col-md-5">
          <input id="editCatName" class="form-control" placeholder="New name">
        </div>
        <div class="col-md-5">
          <input id="editCatDesc" class="form-control" placeholder="New description">
        </div>
        <div class="col-md-2">
          <button class="btn btn-warning w-100" onclick="updateCategory()">
            Update
          </button>
        </div>
      </div>
    </div>

    <!-- CATEGORY LIST -->
    <div id="categoriesList"></div>
  </div>
  <div class="table-card mb-4">
    <h5>Create Product</h5>

    <div class="row g-2">
      <div class="col-md-4">
        <input id="prodName" class="form-control" placeholder="Name">
      </div>
      <div class="col-md-2">
        <input id="prodPrice" class="form-control" type="number" placeholder="Price">
      </div>
      <div class="col-md-6">
        <input id="prodDesc" class="form-control" placeholder="Description">
      </div>
      <div class="col-md-12">
        <input id="prodImage" class="form-control" placeholder="Image URL">
      </div>
    </div>
    <select id="prodCategory" class="form-select mb-2"></select>
    <button class="btn btn-success mt-3" id="btnAddProduct">
      Add Product
    </button>
  </div>

  <div class="table-card">
    <h5>Products</h5>
    <div id="productsList"></div>
  </div>
  

</main>

<script src="admin.js"></script>
<script>
const token = localStorage.getItem("adminToken");

if (!token) {
  window.location.replace("admin-login.html");
}
</script>
</body>
</html>
