<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5">

  <div class="col-md-4 mx-auto">
    <h3 class="mb-4 text-center">Admin Login</h3>

    <form id="adminLoginForm">
      <input class="form-control mb-3" type="email" placeholder="Email" id="email" required>
      <input class="form-control mb-3" type="password" placeholder="Password" id="password" required>
      <button class="btn btn-dark w-100">Login</button>
    </form>

    <div id="error" class="text-danger mt-3"></div>
  </div>
<script>
document.getElementById("adminLoginForm").addEventListener("submit", async e => {
  e.preventDefault();

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const res = await fetch("/api/auth/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ email, password })
  });

  const data = await res.json();

  if (!res.ok) {
    document.getElementById("error").textContent = data.message;
    return;
  }

  const payload = JSON.parse(atob(data.token.split(".")[1]));

  if (payload.role !== "admin") {
    document.getElementById("error").textContent =
      "Access denied. Admin only.";
    return;
  }

  localStorage.setItem("adminToken", data.token);
  window.location.href = "admin.html";
});
</script>
</body>
</html>
