<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Favorites — AITU-Tech</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light sticky-top nav-glass">
  <div class="container">
    <a class="navbar-brand brand" href="index.html">AITU-Tech</a>

    <div class="ms-auto d-flex align-items-center gap-2">
      <a href="favorites.html" class="icon-btn">
        <i class="bi bi-heart"></i>
        <span class="fav-badge">0</span>
      </a>

      <a href="cart.html" class="icon-btn">
        <i class="bi bi-cart3"></i>
        <span class="cart-badge">0</span>
      </a>
    </div>
  </div>
</nav>

<header class="hero-mini">
  <div class="container">
    <h1 class="h2 fw-bold mb-0">Favorites</h1>
  </div>
</header>

<main class="container py-5">

  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h2 class="fw-bold mb-0">Favorites</h2>

    <div class="d-flex gap-2">
      <a href="catalog.html" class="btn btn-outline-dark btn-sm">
        <i class="bi bi-grid me-1"></i> Catalog
      </a>

      <a href="cart.html" class="btn btn-outline-dark btn-sm">
        <i class="bi bi-cart3 me-1"></i> Cart
      </a>

      <a href="index.html" class="btn btn-dark btn-sm">
        <i class="bi bi-house me-1"></i> Home
      </a>
    </div>
  </div>

  <div id="favorites-container" class="catalog-grid"></div>

  <div id="emptyState" class="text-muted text-center d-none mt-5">
    <i class="bi bi-heart fs-1 d-block mb-3"></i>
    No favorites yet
  </div>

</main>

<footer class="footer">
  <div class="container text-center">
    <small>© 2025 AITU-Tech</small>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/favorites.js"></script>
<script src="script.js"></script>

<script type="module">
  import { initNavbar } from "./js/ui.js";

  initNavbar();

  function getFavorites() {
    try {
      return JSON.parse(localStorage.getItem("favorites") || "[]");
    } catch {
      return [];
    }
  }

  function saveFavorites(list) {
    localStorage.setItem("favorites", JSON.stringify(list));
  }

  function removeFavorite(id) {
    const updated = getFavorites().filter(f => f !== id);
    saveFavorites(updated);
    renderFavorites();
  }

  async function renderFavorites() {
    const ids = getFavorites();
    const container = document.getElementById("favorites-container");
    const empty = document.getElementById("emptyState");

    container.innerHTML = "";
    empty.classList.add("d-none");

    if (!ids.length) {
      empty.classList.remove("d-none");
      return;
    }

    const res = await fetch("/api/products");
    const products = await res.json();

    const filtered = products.filter(p =>
      ids.includes(String(p._id))
    );

    if (!filtered.length) {
      empty.classList.remove("d-none");
      return;
    }

    container.innerHTML = filtered.map(p => `
      <div class="product-card ui-card">

        <img class="product-media"
             src="${p.imageUrl || '/images/placeholder.png'}">

        <div class="p-3">

          <h6 class="mb-2">${p.name}</h6>

          <div class="fw-bold mb-3">
            ₸ ${Number(p.price).toLocaleString("ru-RU")}
          </div>

          <div class="d-flex gap-2">

            <button class="btn btn-dark btn-sm w-100"
              onclick="addToCart('${p._id}', '${p.name}', ${p.price}, '${p.imageUrl}')">
              <i class="bi bi-cart-plus"></i>
            </button>

            <button class="btn btn-outline-danger btn-sm w-100"
              onclick="removeFav('${p._id}')">
              <i class="bi bi-trash"></i>
            </button>

          </div>

        </div>

      </div>
    `).join("");
  }

  window.removeFav = function(id) {
    removeFavorite(String(id));
  };

  window.addToCart = function(id, title, price, img) {
    const cart = JSON.parse(localStorage.getItem("cart") || "[]");

    const existing = cart.find(i => i.id === id);

    if (existing) {
      existing.qty += 1;
    } else {
      cart.push({
        id,
        title,
        price,
        img,
        qty: 1
      });
    }

    localStorage.setItem("cart", JSON.stringify(cart));
    alert("Added to cart");
  };

  renderFavorites();
</script>
</body>
</html>
