<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Register — AITU-Tech</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="bg-light">

  <main class="container py-5" style="max-width:520px">
    <div class="ui-card">
      <h1 class="h4 fw-bold mb-3">Create account</h1>

      <div id="err" class="alert alert-danger d-none"></div>

      <form id="form">
        <label class="form-label">Email</label>
        <input class="form-control mb-3" type="email" id="email" required placeholder="name@example.com" />

        <label class="form-label">Password</label>
        <input class="form-control mb-3" type="password" id="password" required minlength="6" placeholder="min 6 characters" />

        <button class="btn btn-dark w-100" type="submit">Register</button>
      </form>

      <div class="small text-muted mt-3">
        Already have an account? <a href="login.html">Login</a>
      </div>
    </div>
  </main>

  <script type="module">
    import { Auth } from "./js/auth.js";

    const form = document.getElementById("form");
    const err = document.getElementById("err");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.classList.add("d-none");
      err.textContent = "";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        await Auth.register(email, password);
        window.location.href = "index.html";
      } catch (e) {
        err.textContent = e.message || "Register failed";
        err.classList.remove("d-none");
      }
    });
  </script>
</body>
</html>
