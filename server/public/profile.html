<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Profile — AITU-Tech</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light sticky-top nav-glass">
  <div class="container">
    <a class="navbar-brand brand" href="index.html">AITU-Tech</a>
  </div>
</nav>

<header class="hero-mini">
  <div class="container">
    <h2 class="fw-bold mb-0">My Profile</h2>
  </div>
</header>

<main class="container py-5">

  <!-- PROFILE INFO -->
  <div class="ui-card mb-5">
    <div class="d-flex align-items-center gap-3">
      <i class="bi bi-person-circle fs-1"></i>
      <div>
        <div id="profileEmail" class="fw-bold fs-5"></div>
        <div class="text-muted small">Account information</div>
      </div>
    </div>
  </div>

  <!-- ORDERS -->
  <h4 class="fw-bold mb-3">My Orders</h4>
  <div id="ordersContainer" class="d-flex flex-column gap-4"></div>

</main>

<script type="module">
  import { Auth } from "./js/auth.js";
  import { initNavbar } from "./js/ui.js";

  initNavbar();

  const token = localStorage.getItem("token");

  if (!token) {
    window.location.href = "login.html";
  }

  const user = Auth.getUserFromToken();
  document.getElementById("profileEmail").textContent = user?.email || "User";

  const container = document.getElementById("ordersContainer");

  function getStatusColor(status) {
    const map = {
      pending: "warning",
      paid: "success",
      shipped: "primary",
      cancelled: "danger"
    };
    return map[status] || "secondary";
  }

  try {
    const res = await fetch("/api/orders/my", {
      headers: {
        "Authorization": "Bearer " + token
      }
    });

    const orders = await res.json();

    if (!orders.length) {
      container.innerHTML = `
        <div class="text-muted">No orders yet</div>
      `;
    } else {
      container.innerHTML = orders.map(o => `
        <div class="order-card">
          <div class="order-header">
            <div>
              <div class="order-id">Order #${o._id.slice(-6)}</div>
            </div>
            <span class="badge bg-${getStatusColor(o.status)}">
              ${o.status}
            </span>
          </div>

          <div class="order-body">
            <div>Total items: ${o.items.length}</div>
          </div>
        </div>
      `).join("");
    }

  } catch (err) {
    container.innerHTML = `
      <div class="alert alert-danger">Failed to load orders</div>
    `;
  }
</script>

</body>
</html>
