<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Product — AITU-Tech</title>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light sticky-top nav-glass">
  <div class="container">
    <a class="navbar-brand brand" href="index.html">AITU-Tech</a>

    <div class="ms-auto d-flex align-items-center gap-2">
      <a href="favorites.html" class="icon-btn">
        <i class="bi bi-heart"></i>
        <span class="fav-badge">0</span>
      </a>

      <a href="cart.html" class="icon-btn">
        <i class="bi bi-cart3"></i>
        <span class="cart-badge">0</span>
      </a>
    </div>
  </div>
</nav>

<!-- HERO -->
<header class="hero-mini">
  <div class="container">
    <h1 class="h4 fw-bold mb-0">Product Details</h1>
  </div>
</header>

<!-- MAIN -->
<main class="container py-5">

  <div class="row g-5">

    <!-- IMAGE -->
    <div class="col-lg-6">
      <div class="ui-card text-center">
        <img id="productImage"
             class="img-fluid product-media"
             style="max-height:400px"
             alt="Product image">
      </div>
    </div>

    <!-- INFO -->
    <div class="col-lg-6">

      <div class="mb-3">
        <h2 id="productTitle" class="fw-bold"></h2>
        <div class="text-muted" id="productCategory"></div>
      </div>

      <div class="mb-4">
        <h3 id="productPrice" class="fw-bold"></h3>
      </div>

      <div class="d-flex gap-3 mb-4">

        <button id="favBtn" class="btn btn-outline-danger">
          <i class="bi bi-heart"></i>
        </button>

        <button id="addBtn" class="btn btn-dark px-4">
          <i class="bi bi-cart-plus me-1"></i> Add to cart
        </button>

      </div>

      <div class="ui-card">
        <h6 class="fw-bold mb-2">Product Description</h6>
        <p id="productDescription" class="text-muted mb-0"></p>
      </div>

    </div>

  </div>

</main>

<footer class="footer">
  <div class="container text-center">
    <small>© 2025 AITU-Tech</small>
  </div>
</footer>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/favorites.js"></script>
<script src="script.js"></script>
<script src="js/ui.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async () => {

  if (window.initNavbar) initNavbar();

  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  if (!id) return;

  const res = await fetch("/api/products/" + id);
  const p = await res.json();

  document.getElementById("productTitle").textContent = p.name;
  document.getElementById("productImage").src = p.imageUrl || "/images/placeholder.png";
  document.getElementById("productCategory").textContent =
    p.categoryId?.name || "No category";

  document.getElementById("productPrice").textContent =
    "₸ " + Number(p.price).toLocaleString("ru-RU");

  document.getElementById("productDescription").textContent =
    p.description || "No description provided.";

  const favBtn = document.getElementById("favBtn");
  const icon = favBtn.querySelector("i");

  if (window.Favorites && Favorites.isFavorite(id)) {
    icon.classList.replace("bi-heart", "bi-heart-fill");
    icon.classList.add("text-danger");
  }

  favBtn.addEventListener("click", () => {
    if (!window.Favorites) return;

    Favorites.toggleFavorite(id);

    if (Favorites.isFavorite(id)) {
      icon.classList.replace("bi-heart", "bi-heart-fill");
      icon.classList.add("text-danger");
    } else {
      icon.classList.replace("bi-heart-fill", "bi-heart");
      icon.classList.remove("text-danger");
    }
  });

  document.getElementById("addBtn").addEventListener("click", () => {
    addToCart({
      id: p._id,
      title: p.name,
      price: Number(p.price),
      img: p.imageUrl
    });
  });

});
</script>

</body>
</html>
