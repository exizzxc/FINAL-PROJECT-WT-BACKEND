<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Orders — AITU-Tech</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light sticky-top nav-glass">
  <div class="container">
    <a class="navbar-brand brand" href="index.html">AITU-Tech</a>
  </div>
</nav>

<header class="hero-mini">
  <div class="container">
    <h2 class="fw-bold mb-0">My Orders</h2>
  </div>
</header>

<main class="container py-5">
  <div id="ordersContainer" class="d-flex flex-column gap-4"></div>
</main>

<script type="module">
  import { API } from "./js/api.js";
  import { Auth } from "./js/auth.js";
  import { initNavbar } from "./js/ui.js";

  initNavbar();

  if (!Auth.isLoggedIn()) {
    window.location.href = "login.html";
  }

  try {
    const orders = await API.get("/api/orders/my", { auth: true });

    const container = document.getElementById("ordersContainer");

    if (!orders.length) {
      container.innerHTML = "<div class='text-muted'>No orders yet</div>";
    } else {
      container.innerHTML = orders.map(order => `
        <div class="ui-card">
          <div><strong>Order ID:</strong> ${order._id}</div>
          <div><strong>Status:</strong> ${order.status}</div>
          <div><strong>Total:</strong> ₸ ${order.totalAmount}</div>
          <div><strong>Items:</strong> ${order.items.length}</div>
        </div>
      `).join("");
    }

  } catch (err) {
    document.getElementById("ordersContainer").innerHTML =
      "<div class='text-danger'>Failed to load orders</div>";
  }
</script>

</body>
</html>
