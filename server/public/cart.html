<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light sticky-top nav-glass">
  <div class="container">
    <a class="navbar-brand brand" href="index.html">AITU-Tech</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMainCart">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMainCart">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="catalog.html">Catalog</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        <li class="nav-item"><a class="nav-link" href="admin.html">Admin</a></li>
      </ul>

      <div class="nav-icons ms-3 d-flex align-items-center gap-2">

        <a href="favorites.html" class="icon-btn" aria-label="Favorites">
          <i class="bi bi-heart"></i><span class="fav-badge">0</span>
        </a>

        <a href="cart.html" class="icon-btn" aria-label="Cart">
          <i class="bi bi-cart3"></i><span class="cart-badge">0</span>
        </a>

        <a href="login.html" class="icon-btn" data-nav-login aria-label="Login">
          <i class="bi bi-person"></i>
        </a>

        <a href="profile.html" class="icon-btn d-none" data-nav-profile aria-label="Profile">Profile</a>

        <button class="btn btn-sm btn-outline-dark d-none" data-nav-logout type="button">
          Logout
        </button>

      </div>

    </div>
  </div>
</nav>

<header class="hero-mini">
  <div class="container">
    <div class="d-flex flex-column flex-lg-row align-items-lg-end justify-content-between gap-3">
      <div>
        <h1 class="h2 fw-bold mb-1">Your Cart</h1>
        <p class="text-muted mb-0">Review items and proceed to checkout.</p>
      </div>
      <div class="d-flex gap-2">
        <a class="btn btn-outline-dark btn-sm" href="catalog.html">
          <i class="bi bi-grid me-1"></i> Catalog
        </a>
        <a class="btn btn-dark btn-sm" href="index.html">
          <i class="bi bi-house me-1"></i> Home
        </a>
      </div>
    </div>
  </div>
</header>

<main class="container py-5">

  <div class="row g-4">

    <div class="col-lg-8">

      <div class="ozon-card p-4">
        <h4 class="fw-bold mb-4">Cart Items</h4>

        <div id="cartContainer"></div>

      </div>

    </div>

    <div class="col-lg-4">

      <div class="ozon-card p-4 sticky-summary">

        <h5 class="fw-bold mb-3">Your Cart</h5>

        <div class="d-flex justify-content-between mb-2">
          <span>Items</span>
          <span id="summaryCount">0</span>
        </div>

        <div class="d-flex justify-content-between mb-3">
          <span>Total</span>
          <span class="fw-bold fs-5" id="summaryTotal">₸ 0</span>
        </div>

        <button id="checkoutBtn" class="btn btn-success w-100">
          Proceed to Checkout
        </button>

      </div>

    </div>

  </div>

</main>

<footer class="footer">
  <div class="container text-center">
    <small>© 2025 AITU-Tech. Premium Electronics Store.</small>
  </div>
</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
<script type="module">
  import { initNavbar } from "./js/ui.js";

  initNavbar();

  function getCart() {
    try {
      return JSON.parse(localStorage.getItem("cart") || "[]");
    } catch {
      return [];
    }
  }

  function saveCart(cart) {
    localStorage.setItem("cart", JSON.stringify(cart));
  }

  function updateSummary(cart) {
    const total = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
    const count = cart.reduce((sum, i) => sum + i.qty, 0);

    document.getElementById("summaryTotal").textContent =
      "₸ " + total.toLocaleString("ru-RU");

    document.getElementById("summaryCount").textContent = count;
  }

  function renderCart() {
    const container = document.getElementById("cartContainer");
    const cart = getCart();

    if (!cart.length) {
      container.innerHTML =
        "<div class='text-muted'>Your cart is empty</div>";
      updateSummary([]);
      return;
    }

    container.innerHTML = cart.map((item, index) => `
      <div class="cart-item">

        <img class="cart-img" src="${item.img || '/images/placeholder.png'}">

        <div class="flex-grow-1">
          <div class="cart-title">${item.title}</div>
          <div class="text-muted small mb-2">
            ₸ ${Number(item.price).toLocaleString("ru-RU")}
          </div>

          <div class="qty-control">
            <button class="qty-btn" onclick="changeQty(${index}, -1)">−</button>
            <span>${item.qty}</span>
            <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
          </div>
        </div>

        <div class="text-end">
          <div class="fw-bold mb-2">
            ₸ ${(item.price * item.qty).toLocaleString("ru-RU")}
          </div>
          <button class="btn btn-sm btn-outline-danger"
            onclick="removeItem(${index})">
            <i class="bi bi-trash"></i>
          </button>
        </div>

      </div>
    `).join("");

    updateSummary(cart);
  }

  window.changeQty = function(index, delta) {
    const cart = getCart();
    cart[index].qty += delta;
    if (cart[index].qty <= 0) {
      cart.splice(index, 1);
    }
    saveCart(cart);
    renderCart();
  };

  window.removeItem = function(index) {
    const cart = getCart();
    cart.splice(index, 1);
    saveCart(cart);
    renderCart();
  };

  document.getElementById("checkoutBtn")
    .addEventListener("click", async () => {

    const token = localStorage.getItem("token");
    if (!token) {
      alert("Login required");
      window.location.href = "login.html";
      return;
    }

    const cart = getCart();
    if (!cart.length) {
      alert("Cart is empty");
      return;
    }

    try {
      const res = await fetch("/api/orders", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({ items: cart })
      });

      if (!res.ok) throw new Error("Order failed");

      alert("Order placed!");
      localStorage.removeItem("cart");
      renderCart();

    } catch (e) {
      alert(e.message);
    }

  });

  renderCart();
</script>
</body>
</html>
